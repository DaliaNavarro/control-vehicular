services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"
    environment:
      DB_HOST: db
      DB_NAME: vehicular
      DB_USER: vehicular
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Mexico_City}
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Configura APP_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/health.php') === 'OK' ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: vehicular
      MARIADB_USER: vehicular
      MARIADB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configura DB_ROOT_PASSWORD en .env}
    volumes:
      - vehicular_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
volumes:
  vehicular_data:
